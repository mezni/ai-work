[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-ticket-triage-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[dependency-groups]
dev = ["pytest>=8.0"]
