[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-ops-agent"
version = "0.0.9"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/support_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
