# Telco RAG configuration.
# Base values are read here; environment variables override (see config contract).

corpus:
  document_dir: data/documents

chunking:
  chunk_size: 500
  chunk_overlap: 50

retrieval:
  top_k: 4                     # Level 1 query depth (legacy, unchanged)
  similarity_threshold: 0.0
  vector_db_path: data/chroma
  collection: telco_documents
  # Level 3 advanced retrieval (contracts/retrieval-config.md)
  strategy: vector             # vector | bm25 | hybrid | hybrid_reranked
  stage_top_k:
    vector: 20
    bm25: 20
    hybrid: 20
    final: 5
  fusion:
    method: rrf                # level 3 supports rrf only
    k: 60
  filters: {}                  # generic metadata filters, {} = unrestricted

reranking:
  enabled: true
  model: BAAI/bge-reranker-base
  candidate_k: 20
  final_k: 5

query_rewriting:
  enabled: false              # Principle XXIX: off by default

embedding:
  provider: local-sentence-transformers
  model: BAAI/bge-small-en-v1.5

evaluation:
  dataset_path: data/evaluation/retrieval_questions.jsonl
  default_k: 5

llm:
  base_url: https://openrouter.ai/api/v1
  api_key: ""
  model: ""
  max_tokens: 512
  temperature: 0.0
grounding:
  sufficiency_threshold: 0.0
  min_evidence: 1
  structured_output: true
